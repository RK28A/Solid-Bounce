buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // MixinGradle: generates the refmap and reobfuscates mixin references for production jars.
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
}

apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

// Forge 1.20.1 runs on Java 17. Gradle will download a matching toolchain if needed.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // Official (Mojang) mappings for 1.20.1.
    mappings channel: project.mappings_channel, version: project.mappings_version

    // Access transformer (created later when a module needs wider access).
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Declared after the minecraft block so it sees the configured mappings: MixinGradle needs them
// to reobfuscate the refmap from Mojang names to the SRG names the game actually runs on.
mixin {
    add sourceSets.main, 'solidbounce.refmap.json'
    config 'solidbounce.mixins.json'
}

repositories {
    mavenCentral()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Kotlin runtime + language adapter provided as a mod at runtime.
    implementation "thedarkcolour:kotlinforforge:${project.kotlin_for_forge_version}"

    // Mixin annotation processor (generates the refmap for our Java mixins).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Kotlin bytecode still needs -parameters style names free; nothing special here.
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_id,
            'Specification-Vendor'    : 'Solid-Bounce',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.mod_name,
            'Implementation-Version'  : project.mod_version,
            'Implementation-Vendor'   : 'Solid-Bounce'
            // The mixin config is registered via mods.toml ([[mixins]]); no manifest entry needed.
        ])
    }
    finalizedBy 'reobfJar'
}

// The refmap is what lets Mixin resolve the Mojang names written in our annotations against the
// SRG names present at runtime. If it is missing or still holds Mojang names, every hook fails
// to resolve — silently for require = 0 injections. Print it so the build log says which it is.
tasks.named('reobfJar').configure {
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def entry = zip.getEntry('solidbounce.refmap.json')
            if (entry == null) {
                logger.lifecycle('[Solid-Bounce] REFMAP MISSING from the jar — no mixin hook can resolve at runtime.')
            } else {
                def text = zip.getInputStream(entry).getText('UTF-8')
                logger.lifecycle("[Solid-Bounce] refmap (${text.length()} chars):")
                logger.lifecycle(text)
            }
        }
    }
}
