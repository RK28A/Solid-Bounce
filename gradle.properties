# Gradle — kept in line with the official Forge MDK.
# parallel must stay off: ForgeGradle generates the Minecraft artifact lazily, during task
# execution, and doing that from a Gradle worker thread fails with
# "Project services has been closed" while it sets up the MCP environment.
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx3G

# Mod
mod_id=solidbounce
mod_name=Solid-Bounce
mod_version=0.1.0
mod_group=net.ccbluex.liquidbounce
mod_authors=CCBlueX, Solid-Bounce contributors

# Minecraft / Forge (1.20.1)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[4,)

# Mappings
mappings_channel=official
mappings_version=1.20.1
parchment_version=2023.09.03

# Kotlin For Forge (Kotlin runtime + language adapter for Forge)
kotlin_for_forge_version=4.10.0
